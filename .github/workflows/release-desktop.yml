name: Release desktop (Electron)

# Builds unsigned smoke artifacts by default (no CSC / notarization secrets).
# HUMAN: attach signed binaries to GitHub Releases before marketing as production.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run package:win
          - os: macos-latest
            script: npm run package:mac
          - os: ubuntu-latest
            script: npm run package:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        run: npm ci
      - name: Build & package (unsigned smoke)
        run: ${{ matrix.script }}
        env:
          # Unsigned by default — do not treat as production installers.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-messages-${{ matrix.os }}-unsigned
          path: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.blockmap
          if-no-files-found: warn

  attach-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish unsigned artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            **Note:** Desktop artifacts from this workflow are **unsigned smoke builds**.
            Prefer HUMAN-signed installers for production installs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
