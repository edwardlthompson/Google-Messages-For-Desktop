name: Release desktop (Electron)

# Builds unsigned smoke artifacts by default (no CSC / notarization secrets).
# HUMAN: attach signed binaries to GitHub Releases before marketing as production.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run package:win
          - os: macos-latest
            script: npm run package:mac
          - os: ubuntu-latest
            script: npm run package:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Build & package
        run: ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-messages-${{ matrix.os }}-unsigned
          path: |
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.blockmap
          if-no-files-found: warn

  attach-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish unsigned artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Desktop artifacts from this workflow are **unsigned** unless `CSC_LINK` /
            Apple notarization secrets are set on the repo. Prefer signed installers
            for production.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
