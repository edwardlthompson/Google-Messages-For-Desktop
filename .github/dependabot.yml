version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Root packaging tooling. Lockfile is yarn.lock; Dependabot npm applies to root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns: ["*"]

  # Windows Electron app (OrangeDrangon-derived shell).
  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: weekly
    groups:
      electron-dependencies:
        patterns: ["*"]
