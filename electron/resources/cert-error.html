<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure connection failed</title>
    <style>
      body {
        font: 16px/1.45 system-ui, Segoe UI, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <h1>This connection is not trusted</h1>
    <p>
      Google Messages for Desktop did not ignore the certificate error. The
      Messages session was not opened on this host.
    </p>
    <p id="host"></p>
    <p id="error"></p>
    <p>
      Fix the clock, proxy, or TLS interception on this PC, then use View →
      Reload.
    </p>
    <script>
      const q = new URLSearchParams(location.search);
      document.getElementById("host").textContent = "Host: " + (q.get("host") || "(unknown)");
      document.getElementById("error").textContent = "Error: " + (q.get("error") || "certificate error");
    </script>
  </body>
</html>
