<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'"
    />
    <title>Google Messages</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Candara", "Gill Sans", sans-serif;
        background: #070b12;
        color: #e8eaed;
      }
      .stage {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      .hero {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 28px 24px 22px;
        text-align: center;
        background: linear-gradient(transparent, rgba(7, 11, 18, 0.88) 42%);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: #9aa0a6;
        font-size: 0.95rem;
      }
      .pulse {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img
        class="hero"
        id="hero"
        src="splash-hero.jpg"
        alt=""
        width="1280"
        height="720"
      />
      <div class="copy">
        <h1 id="heading">Google Messages</h1>
        <p id="lede" class="pulse">Opening conversations…</p>
      </div>
    </div>
    <script src="splash-ui.js"></script>
  </body>
</html>
