<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'"
    />
    <title>Google Messages</title>
    <style>
      :root {
        --ink: #102033;
        --muted: #4a5d73;
        --paper: #f7f9fc;
        --accent: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8eaed;
          --muted: #9aa0a6;
          --paper: #1f1f1f;
          --accent: #8ab4f8;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Candara", "Gill Sans", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .pulse {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/256x256.png" alt="" width="72" height="72" />
      <h1 id="heading">Google Messages</h1>
      <p id="lede" class="pulse">Opening conversations…</p>
    </main>
    <script src="splash-ui.js"></script>
  </body>
</html>
