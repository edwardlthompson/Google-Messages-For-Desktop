<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file: data:"
    />
    <title>Google Messages</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Candara", "Gill Sans", sans-serif;
        background: #070b12;
        color: #e8eaed;
      }
      .frame {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1a2333, #070b12 70%);
      }
      .hero {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-fallback {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #1a2333, #070b12 70%);
      }
      .hero-fallback.show { display: flex; }
      .hero-fallback img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 20px 24px 14px;
        text-align: center;
        background: linear-gradient(transparent, rgba(7, 11, 18, 0.88) 42%);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      #lede {
        margin: 0;
        color: #9aa0a6;
        font-size: 0.9rem;
      }
      .pulse { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse {
        50% { opacity: 0.55; }
      }
      .progress {
        flex: 0 0 auto;
        padding: 14px 22px 18px;
        background: #0a1018;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .bar-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-bottom: 12px;
      }
      .bar-fill {
        height: 100%;
        width: 15%;
        border-radius: 2px;
        background: linear-gradient(90deg, #34a853, #1a73e8);
        transition: width 0.35s ease;
      }
      .bar-fill.indeterminate {
        width: 40%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-40%); }
        100% { transform: translateX(220%); }
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.88rem;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #9aa0a6;
      }
      .step.done { color: #e8eaed; }
      .step.active { color: #e8eaed; }
      .mark {
        width: 1.25rem;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1;
      }
      .step.done .mark { color: #34a853; }
      .step.active .mark { color: #1a73e8; }
      .hint {
        margin: 10px 0 0;
        color: #80868b;
        font-size: 0.75rem;
        line-height: 1.35;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .bar-fill.indeterminate { animation: none; }
        .bar-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="stage">
        <img class="hero" id="hero" alt="" width="1280" height="720" decoding="async" fetchpriority="low" />
        <div class="hero-fallback" id="heroFallback" aria-hidden="true">
          <img id="logoFallback" alt="" width="96" height="96" />
        </div>
        <div class="copy">
          <h1 id="heading">Google Messages</h1>
          <p id="lede" class="pulse">Starting desktop app…</p>
        </div>
      </div>
      <div class="progress" id="progress" aria-live="polite">
        <div class="bar-track">
          <div class="bar-fill indeterminate" id="barFill"></div>
        </div>
        <div class="steps">
          <div class="step" id="stepApp" data-step="app">
            <span class="mark" id="markApp">○</span>
            <span id="labelApp">App</span>
          </div>
          <div class="step" id="stepMsg" data-step="messages">
            <span class="mark" id="markMsg">○</span>
            <span id="labelMsg">Google Messages loading…</span>
          </div>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
    <script src="splash-ui.js"></script>
  </body>
</html>
